[project]
name = "byte-8-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hethshah12", email = "hethshah12@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.1",
    "chromadb>=1.5.9",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[project.scripts]
byte-8-ai = "byte_8_ai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
